dependencies:
  idf: ">=5.5.0"
  # Registry names checked against ESP-IDF 5.5 component manager usage.
  # M5Unified brings M5GFX. esp-sr stays on 2.6 because 2.5.4 boot-loops CoreS3.
  m5stack/M5Unified: ">=0.2.2"
  espressif/esp-sr: "~2.6.0"
  espressif/esp-dsp: "^1.5.0"
  # Moved out of ESP-IDF in 5.0. The CMake name is espressif__esp_websocket_client.
  espressif/esp_websocket_client: "^1.6.0"
